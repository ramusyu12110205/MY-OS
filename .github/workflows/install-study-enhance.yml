name: Cleanup accidental qualification enhancement
on:
  push:
    paths:
      - '.github/workflows/install-study-enhance.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="study-os-enhance.js?v=2"></script>\n','')
          s=s.replace('<script src="study-os-enhance.js"></script>\n','')
          p.write_text(s)
          PY
          rm -f study-os-enhance.js .github/workflows/install-study-enhance.yml
      - name: Commit and push cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Revert accidental qualification OS changes'
          git push
