<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY OS</title>
<style>
:root{--bg:#080c17;--card:#12182a;--card2:#0e1422;--text:#f5f7ff;--muted:#98a3bf;--accent:#8b5cf6;--cyan:#22d3ee;--good:#34d399;--bad:#fb7185;--gold:#fbbf24;--line:#26314d}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1120px;margin:auto;padding:18px 18px 90px;background:radial-gradient(circle at top left,#1a1640 0,#090e1a 42%,#050812 100%);color:var(--text)}
h1{font-size:30px;margin:0 0 4px} h2{margin:0} h3{margin:0 0 10px} .muted{color:var(--muted)} .small{font-size:13px}
.card{background:linear-gradient(145deg,rgba(18,24,42,.96),rgba(10,15,28,.98));border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 15px 45px rgba(0,0,0,.22)}
.hero{background:linear-gradient(135deg,#1b1242,#4c1d95 50%,#0e7490);border-color:#463676;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:rgba(5,9,20,.38);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:13px}
.mini b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#b4bdd5} .mini strong{font-size:22px}
.big{font-size:42px;font-weight:950;letter-spacing:-1px} .kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#b6c0dd;font-weight:900}
.levelrow{display:flex;gap:12px;align-items:center} .level{font-size:35px;font-weight:950} .xpbar{flex:1}
.bar{height:10px;background:#252e47;border-radius:99px;overflow:hidden} .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:99px}
.quest{background:linear-gradient(135deg,#171c35,#11182b);border:1px solid #39466b;border-radius:17px;padding:16px;margin-top:12px}
.quest-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aab5d5;font-weight:900} .quest-main{font-size:23px;font-weight:950;margin:4px 0}
.countdown{font-size:34px;font-weight:950} .sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0;background:#0f1627}
.clickable{cursor:pointer}
.action-card{transition:.15s}
.action-card.active{border-color:#6f52c8;box-shadow:0 0 0 1px rgba(139,92,246,.22),0 10px 24px rgba(0,0,0,.16)}
.inline-panel{margin:10px 0 0;padding:16px;border:1px solid #33405f;border-radius:16px;background:linear-gradient(145deg,#10182a,#0c1220)}
.inline-panel h3{margin-top:0}
 .clickable:hover{border-color:#53638f;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.badge{display:inline-block;background:#261b50;color:#d7ceff;border:1px solid #45337c;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:11px;padding:10px 15px;font-weight:850;cursor:pointer;min-height:42px}
.primary{background:var(--accent);color:#fff} .light{background:#222b43;color:#e8ecff;border:1px solid #33405f} .danger{background:#3d1725;color:#ffc1cf;border:1px solid #6b2941}
input,textarea,select{width:100%;padding:11px;border:1px solid #394563;border-radius:11px;background:#0c1322;color:#f4f6ff;font-size:16px;min-height:44px}
textarea{min-height:120px} label{display:block;font-weight:800;margin:11px 0 6px}
.tabnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .tabnav button{background:#202840;color:#dde4fb;border:1px solid #33405e} .tabnav button.active{background:var(--accent);color:#fff}
.bottom-nav{display:none}
.modal{position:fixed;inset:0;background:rgba(3,6,13,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
.modal.open{display:flex} .modal-box{width:min(680px,100%);max-height:90vh;overflow:auto;background:#10172a;border:1px solid #33405e;border-radius:20px;padding:18px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101827;border:1px solid #354361;color:#fff;padding:11px 15px;border-radius:12px;z-index:200;display:none}
.auth{min-height:55vh;display:flex;align-items:center;justify-content:center} .authbox{max-width:480px;text-align:center}
.record-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center} .record-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px} .record-meta span{background:#1b2339;border:1px solid #2e3956;border-radius:999px;padding:4px 9px;font-size:12px;color:#c9d2e9}
@media(max-width:700px){
  body{padding:12px 12px 86px} .grid{grid-template-columns:1fr} .statgrid{grid-template-columns:1fr}
  .tabnav{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:fixed;left:9px;right:9px;bottom:9px;z-index:90;background:rgba(13,19,35,.97);border:1px solid #303a59;border-radius:18px;padding:7px;box-shadow:0 15px 40px rgba(0,0,0,.45)}
  .bottom-nav button{background:transparent;color:#9fa9c7;border:0;padding:8px 4px;font-size:12px}
  .bottom-nav button.active{background:#6d43d9;color:#fff} .hero .big{font-size:35px} .record-grid{grid-template-columns:1fr}
}
</style>

<style>
/* ===== MY OS shell ===== */
:root{
  --myos-sidebar: 250px;
  --myos-bg:#f5f7fa;
  --myos-panel:#ffffff;
  --myos-border:#e5e7eb;
  --myos-text:#1f2937;
  --myos-muted:#6b7280;
}
body{background:var(--myos-bg)!important;}
#myosShell{min-height:100vh;}
.myos-sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--myos-sidebar);
  background:#fff;border-right:1px solid var(--myos-border);
  padding:20px 14px;z-index:1000;overflow-y:auto;
}
.myos-brand{font-weight:800;font-size:20px;padding:8px 10px 18px;}
.myos-group-title{font-size:11px;color:var(--myos-muted);font-weight:700;padding:12px 10px 6px;text-transform:uppercase;}
.myos-nav{
  width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;
  border-radius:10px;cursor:pointer;font-size:14px;color:var(--myos-text);
}
.myos-nav:hover{background:#f3f4f6;}
.myos-nav.active{background:#eef2ff;font-weight:700;}
.myos-main{margin-left:var(--myos-sidebar);min-height:100vh;padding:20px;}
.myos-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.myos-menu-btn{display:none;border:1px solid var(--myos-border);background:#fff;border-radius:9px;padding:8px 10px;}
.myos-module{display:none;}
.myos-module.active{display:block;}
#studyAppHost{max-width:900px;margin:0 auto;}
#householdPlaceholder{
  max-width:1000px;margin:0 auto;background:#fff;border:1px solid var(--myos-border);
  border-radius:16px;padding:28px;
}
#householdPlaceholder h2{margin-top:0;}
.myos-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px;}
.myos-card{background:#fff;border:1px solid var(--myos-border);border-radius:14px;padding:18px;}
.myos-small{font-size:13px;color:var(--myos-muted);}
@media(max-width:760px){
  .myos-sidebar{transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.08);}
  .myos-sidebar.open{transform:translateX(0);}
  .myos-main{margin-left:0;padding:12px;}
  .myos-menu-btn{display:inline-block;}
  .myos-card-grid{grid-template-columns:1fr;}
}

.myos-section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px;}
.myos-card button.myos-nav{margin-top:10px;padding-left:0;}
@media(max-width:760px){.myos-section-head{align-items:flex-start;}}
</style>

.myos-card button.light { color:#1f2937; background:#f3f4f6; border:1px solid #d1d5db; }
.myos-card button.primary { color:#fff; }
</style>
</head>

let selectedReviewSubject=null;

function localDate(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function today(){return localDate()}
function parseDate(s){return new Date(s+'T00:00:00')}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)}
function fmt(s){if(!s)return '—';const d=parseDate(s);return `${d.getMonth()+1}/${d.getDate()}`}
function minutesText(m){m=Number(m)||0;return `${Math.floor(m/60)}時間${m%60}分`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}

async function init(){
  document.getElementById('recordDate').value=today();
  const {data:{session}}=await sb.auth.getSession();
  if(session) await boot(session.user);
  else showAuth();
  sb.auth.onAuthStateChange(async (event,session)=>{
    if(event==='SIGNED_IN' && session) await boot(session.user);
    if(event==='SIGNED_OUT') showAuth();
  });
}

function showAuth(){
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
async function loginWithGoogle(){
  document.getElementById('authError').textContent='';
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
  if(error) document.getElementById('authError').textContent=error.message;
}
async function logout(){await sb.auth.signOut()}
async function boot(user){
  currentUser=user;
  window.currentUser=user;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userLabel').textContent=user.email||'';
  document.getElementById('settingsUser').textContent=user.email||'';
  await loadAll();
  openTab('review');
}

async function loadAll(){
  const uid=currentUser.id;
  const [q,s,p,st]=await Promise.all([
    sb.from('qualifications').select('*').eq('user_id',uid).eq('archived',false).order('sort_order').order('name'),
    sb.from('subjects').select('*').eq('user_id',uid).eq('archived',false).order('sort_order').order('name'),
    sb.from('problems').select('*').eq('user_id',uid).order('name'),
    sb.from('study_sessions').select('*').eq('user_id',uid).order('study_date',{ascending:false}).order('created_at',{ascending:false})
  ]);
  for(const r of [q,s,p,st]) if(r.error) throw r.error;
  qualifications=q.data||[]; subjects=s.data||[]; problems=p.data||[]; sessions=st.data||[];
  refreshRecordSelects();
  renderAll();
}
function renderAll(){updateHero();renderReview();}
function openTab(name){
  ['review','record','status','settings'].forEach(x=>{
    const el=document.getElementById('tab-'+x); if(el) el.style.display=x===name?'block':'none';
    const a=document.getElementById('tabbtn-'+x),b=document.getElementById('bottom-'+x);
    if(a)a.classList.toggle('active',x===name); if(b)b.classList.toggle('active',x===name);
  });
  if(name==='review') renderReview();
  if(name==='status') showDashboard();
  if(name==='record') refreshRecordSelects();
  window.scrollTo({top:0,behavior:'smooth'});
}
function refreshRecordSelects(){
  const q=document.getElementById('recordQualification'),s=document.getElementById('recordSubject');
  if(!q||!s)return;
  q.innerHTML=qualifications.length?qualifications.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option value="">資格を設定してください</option>';
  refreshSubjectSelect();
}
function refreshSubjectSelect(){
  const qid=document.getElementById('recordQualification')?.value,s=document.getElementById('recordSubject'); if(!s)return;
  const arr=subjects.filter(x=>x.qualification_id===qid);
  s.innerHTML=arr.length?arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option value="">科目を設定してください</option>';
}
document.addEventListener('change',e=>{if(e.target.id==='recordQualification')refreshSubjectSelect();if(e.target.id==='pastQualification')refreshPastSubjectSelect();});

function dueItems(){
  const t=today();
  return problems.filter(p=>p.status==='pending' && p.next_review_date===t);
}
function renderReview(){
  const due=dueItems();
  document.getElementById('reviewCount').textContent=due.length+'問';
  if(!due.length){document.getElementById('reviewList').innerHTML='<div class="item">🎉 今日の復習はありません。</div>';return}
  const groups={};
  due.forEach(p=>{if(!groups[p.subject_id])groups[p.subject_id]=[];groups[p.subject_id].push(p)});
  document.getElementById('reviewList').innerHTML=Object.entries(groups).map(([sid,arr])=>{
    const sub=subjects.find(s=>s.id===sid),q=qualifications.find(q=>q.id===sub?.qualification_id);
    return `<details open style="margin:10px 0"><summary style="cursor:pointer;font-weight:900">${esc(q?.name||'資格')} / ${esc(sub?.name||'科目')} <span class="badge">${arr.length}問</span></summary>
      <div style="padding-top:7px">${arr.map(p=>`<label class="item" style="display:flex;gap:10px;align-items:center;cursor:pointer"><input class="dueCheck" type="checkbox" data-id="${p.id}" style="width:auto"><span><b>${esc(p.name)}</b><br><span class="muted small">実施 ${p.attempts}回 ・ ${p.last_result==='wrong'?'再復習':p.stage===0?'初回翌日':`${[1,3,7,14,30][p.stage]??'?'}日後`}</span></span></label>`).join('')}</div></details>`;
  }).join('');
}
function selectAllDue(v){document.querySelectorAll('.dueCheck').forEach(x=>x.checked=v)}
function startReview(){
  reviewQueue=[...document.querySelectorAll('.dueCheck:checked')].map(x=>problems.find(p=>p.id===x.dataset.id)).filter(Boolean);
  if(!reviewQueue.length){alert('復習する問題を選択してください');return}
  reviewIndex=0;reviewAnswers=[];document.getElementById('reviewModal').classList.add('open');showReviewQuestion();
}
function showReviewQuestion(){
  if(reviewIndex>=reviewQueue.length){document.getElementById('reviewModal').classList.remove('open');document.getElementById('timeModal').classList.add('open');return}
  const p=reviewQueue[reviewIndex],sub=subjects.find(s=>s.id===p.subject_id),q=qualifications.find(q=>q.id===sub?.qualification_id);
  document.getElementById('reviewProgress').textContent=`${reviewIndex+1} / ${reviewQueue.length}`;
  document.getElementById('reviewQuestion').innerHTML=`<div class="item"><span class="badge">${esc(q?.name||'')} / ${esc(sub?.name||'')}</span><h2 style="margin:12px 0 6px">${esc(p.name)}</h2><div class="muted small">これまで ${p.attempts}回実施</div><div class="row" style="margin-top:18px"><button class="primary" onclick="answerReview('correct')">✓ 合ってた</button><button class="light" onclick="answerReview('wrong')">✕ 間違えた</button></div></div>`;
}
function answerReview(result){reviewAnswers.push({problemId:reviewQueue[reviewIndex].id,result});reviewIndex++;showReviewQuestion()}
function closeReview(){document.getElementById('reviewModal').classList.remove('open');reviewQueue=[];reviewAnswers=[]}
function cancelReviewTime(){document.getElementById('timeModal').classList.remove('open');reviewQueue=[];reviewAnswers=[]}
async function finishReviewSession(){
  const minutes=Number(document.getElementById('reviewMinutes').value||0),memo=document.getElementById('reviewMemo').value.trim();
  if(!minutes){alert('復習時間を入力してください');return}
  const first=reviewQueue[0],sub=subjects.find(s=>s.id===first.subject_id),qid=sub?.qualification_id;
  if(!qid){alert('科目情報が見つかりません');return}
  const {data:sessionId,error}=await sb.rpc('record_review_session',{
    p_qualification_id:qid,p_subject_id:first.subject_id,p_minutes:minutes,p_memo:memo,
    p_items:reviewAnswers.map(x=>({problem_id:x.problemId,result:x.result}))
  });
  if(error){alert('復習の保存に失敗しました: '+error.message);return}
  document.getElementById('reviewMinutes').value='';document.getElementById('reviewMemo').value='';
  document.getElementById('timeModal').classList.remove('open');reviewQueue=[];reviewAnswers=[];
  await loadAll();toast('復習を記録しました');
}

async function saveStudyRecord(){
  const qid=document.getElementById('recordQualification').value,sid=document.getElementById('recordSubject').value;
  const type=document.getElementById('activityType').value,date=document.getElementById('recordDate').value;
  const minutes=Number(document.getElementById('recordMinutes').value||0),memo=document.getElementById('recordMemo').value.trim();
  const raw=document.getElementById('recordProblems').value.trim();
  if(!qid||!date||!minutes){alert('資格・日付・勉強時間は必須です');return}
  if(['new_problems','review'].includes(type)&&!sid){alert('科目を設定してください');return}
  if(type==='new_problems'&&!raw){alert('新規問題の場合は問題を入力してください');return}
  const {data:session,error:se}=await sb.from('study_sessions').insert({
    user_id:currentUser.id,qualification_id:qid,subject_id:sid||null,study_date:date,activity_type:type,minutes,memo:memo||null
  }).select().single();
  if(se){alert('勉強記録の保存に失敗しました: '+se.message);return}
  if(type==='new_problems'){
    const names=raw.split(/\n|,|、/).map(x=>x.trim()).filter(Boolean);
    const rows=names.map(name=>({
      user_id:currentUser.id,subject_id:sid,name,stage:0,next_review_date:addDays(date,1),status:'pending',attempts:0,last_result:null
    }));
    const {data:ps,error:pe}=await sb.from('problems').upsert(rows,{onConflict:'user_id,subject_id,name'}).select('id,name');
    if(pe){alert('問題保存に失敗しました: '+pe.message);return}
    const links=(ps||[]).map(p=>({user_id:currentUser.id,session_id:session.id,problem_id:p.id,role:'new',result:null}));
    if(links.length){const {error:le}=await sb.from('study_session_problems').insert(links);if(le){alert('問題リンクの保存に失敗しました: '+le.message);return}}
  }
  ['recordProblems','recordMinutes','recordMemo'].forEach(id=>document.getElementById(id).value='');
  await loadAll();toast('勉強を記録しました');openTab('review');
}

function calcStreak(){
  const days=[...new Set(sessions.map(s=>s.study_date))].sort().reverse(); if(!days.length||days[0]!==today())return 0;
  let n=0;for(let i=0;i<days.length;i++){if(days[i]===addDays(today(),-i))n++;else break}return n;
}
function updateHero(){
  const total=sessions.reduce((a,s)=>a+Number(s.minutes||0),0),due=dueItems();
  const xp=Math.floor(total)+problems.reduce((a,p)=>a+Number(p.attempts||0),0)*10,level=Math.max(1,Math.floor(xp/300)+1),base=(level-1)*300;
  document.getElementById('heroTotal').textContent=minutesText(total);document.getElementById('heroDue').textContent=due.length+'問';
  document.getElementById('heroQualifications').textContent=qualifications.length;document.getElementById('heroStreak').textContent=calcStreak()+'日 🔥';
  document.getElementById('heroLevel').textContent=level;document.getElementById('heroXpText').textContent=xp+' XP';
  document.getElementById('heroXpBar').style.width=Math.min(100,Math.round((xp-base)/300*100))+'%';
  document.getElementById('heroMission').textContent=due.length?`復習 ${due.length}問を攻略`:'今日の復習はクリア！';
  document.getElementById('heroMissionSub').textContent=due.length?'選択して復習を開始':'新しい学習を記録しましょう';
  const next=qualifications.filter(q=>q.exam_date).sort((a,b)=>a.exam_date.localeCompare(b.exam_date))[0];
  if(next){const diff=Math.ceil((parseDate(next.exam_date)-parseDate(today()))/86400000);document.getElementById('heroCountdown').textContent=diff>=0?`あと ${diff}日`:'試験済み';document.getElementById('heroExamName').textContent=`${next.name} / ${fmt(next.exam_date)}`}
  else{document.getElementById('heroCountdown').textContent='—';document.getElementById('heroExamName').textContent='資格マスタで設定';}
}

function showStats(type){
  const box=document.getElementById('dashboard');
  if(type==='all'){box.innerHTML=`<h3>⏱ 全体の累積</h3><div class="stat">${minutesText(sessions.reduce((a,s)=>a+Number(s.minutes||0),0))}</div><p class="muted">${sessions.length}件の勉強記録</p>`;return}
  const map={};sessions.forEach(s=>{map[s.study_date]=(map[s.study_date]||0)+Number(s.minutes||0)});
  const months={};Object.entries(map).forEach(([d,m])=>{const mo=d.slice(0,7);if(!months[mo])months[mo]={total:0,days:{}};months[mo].total+=m;months[mo].days[d]=m;});
  box.innerHTML='<h3>📅 月別勉強時間</h3><p class="muted small">月をクリックすると日付別に開きます。</p>'+Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([mo,v])=>`<details class="item"><summary style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(mo.replace('-','年')+'月')}</b><strong>${minutesText(v.total)}</strong></div></summary><div style="padding-top:8px">${Object.entries(v.days).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,m])=>`<div class="item" style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${fmt(d)} <span class="muted small">${d}</span></span><strong>${minutesText(m)}</strong></div></div>`).join('')}</div></details>`).join('');
}

function hideInlinePanels(except){
  ['qualification','record','past','import'].forEach(x=>{
    if(x===except)return;
    const p=document.getElementById('panel-'+x),a=document.getElementById('action-'+x);
    if(p)p.style.display='none';
    if(a)a.classList.remove('active');
  });
}
function toggleInlinePanel(type){
  const panel=document.getElementById('panel-'+type),action=document.getElementById('action-'+type);
  if(!panel||!action)return;
  const open=panel.style.display!=='none';
  hideInlinePanels(open?null:type);
  if(open){
    panel.style.display='none'; action.classList.remove('active'); return;
  }
  panel.style.display='block'; action.classList.add('active');
  if(type==='qualification') renderQualificationMasterInline();
  if(type==='record') renderRecordManagerInline();
  if(type==='past') renderPastStudyInline();
  if(type==='import') renderImportInline();
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),0);
}

async function addQualification(){
  const name=document.getElementById('newQName')?.value.trim();
  const exam_date=document.getElementById('newQDate')?.value||null;
  const raw=document.getElementById('newQSubjects')?.value||'';
  if(!name){alert('資格名を入力してください');return}
  if(!currentUser?.id){alert('ログイン状態を確認してください。');return}

  let q=null;

  // 既存（アーカイブ済みを含む）があれば再利用・復元。
  const {data:existing,error:findError}=await sb.from('qualifications')
    .select('*')
    .eq('user_id',currentUser.id)
    .eq('name',name)
    .maybeSingle();

  if(findError){
    alert('資格の確認に失敗しました: '+findError.message);
    return;
  }

  if(existing){
    const {data:updated,error:updateError}=await sb.from('qualifications')
      .update({exam_date,archived:false})
      .eq('id',existing.id)
      .eq('user_id',currentUser.id)
      .select().single();
    if(updateError){
      alert('資格の更新に失敗しました: '+updateError.message);
      return;
    }
    q=updated;
  }else{
    const {data:created,error:createError}=await sb.from('qualifications')
      .insert({user_id:currentUser.id,name,exam_date})
      .select().single();
    if(createError){
      alert('資格の登録に失敗しました: '+createError.message);
      return;
    }
    q=created;
  }

  const names=[...new Set(raw.split(/\r?\n|,|、/).map(x=>x.trim()).filter(Boolean))];

  if(names.length){
    // 同名科目が既にあっても再利用できるように1件ずつ処理。
    for(let i=0;i<names.length;i++){
      const subjectName=names[i];
      const {data:oldSubject,error:subjectFindError}=await sb.from('subjects')
        .select('*')
        .eq('user_id',currentUser.id)
        .eq('qualification_id',q.id)
        .eq('name',subjectName)
        .maybeSingle();

      if(subjectFindError){
        alert('科目の確認に失敗しました: '+subjectFindError.message);
        return;
      }

      if(oldSubject){
        const {error:subjectUpdateError}=await sb.from('subjects')
          .update({archived:false,sort_order:i})
          .eq('id',oldSubject.id)
          .eq('user_id',currentUser.id);
        if(subjectUpdateError){
          alert('科目の更新に失敗しました: '+subjectUpdateError.message);
          return;
        }
      }else{
        const {error:subjectInsertError}=await sb.from('subjects')
          .insert({user_id:currentUser.id,qualification_id:q.id,name:subjectName,sort_order:i});
        if(subjectInsertError){
          alert('科目の登録に失敗しました: '+subjectInsertError.message);
          return;
        }
      }
    }
  }

  await loadAll();
  renderQualificationMasterInline();
  toast('資格を登録しました');
}

async function updateQualification(id){
  const name=document.getElementById('qn-'+id)?.value.trim();
  const exam_date=document.getElementById('qd-'+id)?.value||null;
  const raw=document.getElementById('qs-'+id)?.value||'';
  if(!name){alert('資格名を入力してください');return}

  const {error}=await sb.from('qualifications')
    .update({name,exam_date})
    .eq('id',id).eq('user_id',currentUser.id);
  if(error){alert('資格の更新に失敗しました: '+error.message);return}

  const old=subjects.filter(s=>s.qualification_id===id);
  const names=[...new Set(raw.split(/\r?\n|,|、/).map(x=>x.trim()).filter(Boolean))];
  const existingNames=old.map(s=>s.name);

  const add=names.filter(n=>!existingNames.includes(n));
  if(add.length){
    const {error:e}=await sb.from('subjects').insert(
      add.map((n,i)=>({user_id:currentUser.id,qualification_id:id,name:n,sort_order:old.length+i}))
    );

function parsePastRows(){
  const text=document.getElementById('pastRows')?.value||'';
  const qid=document.getElementById('pastQualification')?.value;
  const rows=[];
  const errors=[];
  const allowed={new_problems:'新規問題',review:'復習',textbook:'テキスト',lecture:'講義',mock:'模試',other:'その他'};
  const reverse=Object.fromEntries(Object.entries(allowed).map(([k,v])=>[v,k]));
  text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach((line,i)=>{
    const parts=line.split('|').map(x=>x.trim());
    if(parts.length<4){
      errors.push(`${i+1}行目：「日付｜科目｜内容｜分｜メモ」の5列で入力してください`);
      return;
    }
    const [date,subjectName,activityText,minutesText,memo='']=parts;
    const activityType=reverse[activityText]||activityText;
    const minutes=Number(minutesText);
    const subject=subjects.find(s=>s.qualification_id===qid && s.name===subjectName);
    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date) || Number.isNaN(parseDate(date).getTime())){
      errors.push(`${i+1}行目：日付が不正です`);
      return;
    }
    if(!subject){
      errors.push(`${i+1}行目：科目「${subjectName}」が資格マスタにありません`);
      return;
    }
    if(!Object.keys(allowed).includes(activityType)){
      errors.push(`${i+1}行目：内容「${activityText}」は使えません`);
      return;
    }
    if(!Number.isInteger(minutes)||minutes<=0){
      errors.push(`${i+1}行目：勉強時間は1分以上の整数で入力してください`);
      return;
    }
    rows.push({study_date:date,subject_id:subject.id,subject_name:subject.name,activity_type:activityType,activity_label:allowed[activityType],minutes,memo:memo||null});
  });
  return {rows,errors};
}
function previewPastStudy(){
  const preview=document.getElementById('pastPreview'); if(!preview)return;
  const {rows,errors}=parsePastRows();
  let out='';
  if(errors.length){
    out+=`<div class="item" style="border-color:#6b2941"><b style="color:#ffb4c3">入力エラー</b><ul style="margin:8px 0">${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;
  }
  if(rows.length){
    const total=rows.reduce((a,r)=>a+r.minutes,0);
    out+=`<div class="item"><div class="sectiontitle"><b>登録プレビュー</b><span class="badge">${rows.length}件 / ${minutesText(total)}</span></div>
      ${rows.map(r=>`<div class="record-meta" style="margin:8px 0"><span>📅 ${r.study_date}</span><span>${esc(r.subject_name)}</span><span>${esc(r.activity_label)}</span><span>${r.minutes}分</span>${r.memo?`<span>💬 ${esc(r.memo)}</span>`:''}</div>`).join('')}
      <div class="row" style="margin-top:12px"><button class="primary" onclick="savePastStudy()">この内容で登録</button><button class="light" onclick="document.getElementById('pastPreview').innerHTML=''">閉じる</button></div>
    </div>`;
  }
  if(!rows.length && !errors.length) out='<div class="item">入力がありません。</div>';
  preview.innerHTML=out;
}
async function savePastStudy(){
  const {rows,errors}=parsePastRows();
  if(errors.length){previewPastStudy();return}
  if(!rows.length){alert('登録する行がありません。');return}
  const qid=document.getElementById('pastQualification')?.value;
  if(!qid){alert('資格を選択してください。');return}
  if(!confirm(`${rows.length}件・合計${minutesText(rows.reduce((a,r)=>a+r.minutes,0))}を過去の勉強記録として登録します。\\n\\n復習ステージと次回復習日は変更しません。`))return;

  const payload=rows.map(r=>({
    user_id:currentUser.id,
    qualification_id:qid,
    subject_id:r.subject_id,
    study_date:r.study_date,
    activity_type:r.activity_type,

    memo:r.memo
  }));

  const {error}=await sb.from('study_sessions').insert(payload);
  if(error){alert('保存に失敗しました: '+error.message);return}

  document.getElementById('pastRows').value='';
  document.getElementById('pastPreview').innerHTML='';
  await loadAll();
  renderPastStudyInline();
  toast(`${rows.length}件の過去記録を登録しました`);
}

async function importLocalData(){
  const raw=localStorage.getItem('qualification_study_os')||localStorage.getItem('qualification_study_os_v14')||localStorage.getItem('qualification_study_os_v13')||localStorage.getItem('qualification_study_os_v12')||localStorage.getItem('qualification_study_os_v6');
  if(!raw){alert('旧端末データが見つかりません。');return}
  let old;try{old=JSON.parse(raw)}catch{alert('旧データを読み込めませんでした。');return}
  if(!Array.isArray(old)||!old.length){alert('取り込めるデータがありません。');return}
  if(!confirm(`${old.length}件の旧勉強記録をクラウドへ取り込みます。続行しますか？`))return;
  const qmap={},smap={},pmap={};
  for(const r of old){
    if(!qmap[r.qualification]){
      const {data:q,error}=await sb.from('qualifications').upsert({user_id:currentUser.id,name:r.qualification},{
        onConflict:'user_id,name'
      }).select().single();if(error){alert(error.message);return}qmap[r.qualification]=q;
    }
    if(!smap[r.qualification+'||'+r.unit]){
      const key=r.qualification+'||'+r.unit;const q=qmap[r.qualification];
      const {data:s,error}=await sb.from('subjects').upsert({user_id:currentUser.id,qualification_id:q.id,name:r.unit},{
        onConflict:'user_id,qualification_id,name'
      }).select().single();if(error){alert(error.message);return}smap[key]=s;
    }
    const sub=smap[r.qualification+'||'+r.unit];
    const {data:sess,error:se}=await sb.from('study_sessions').insert({user_id:currentUser.id,qualification_id:qmap[r.qualification].id,subject_id:sub.id,study_date:r.date,activity_type:'new_problems',minutes:r.minutes||1,memo:r.memo||null}).select().single();
    if(se){alert(se.message);return}
    for(const p of (r.problems||[])){
      const {data:pr,error:pe}=await sb.from('problems').upsert({user_id:currentUser.id,subject_id:sub.id,name:p.name,stage:p.stage||0,next_review_date:p.nextDate||addDays(r.date,1),status:p.status||'pending',attempts:p.attempts||0,last_result:p.lastResult||null},{onConflict:'user_id,subject_id,name'}).select().single();
      if(pe){alert(pe.message);return}pmap[p.id]=pr;
      await sb.from('study_session_problems').upsert({user_id:currentUser.id,session_id:sess.id,problem_id:pr.id,role:'new',result:null},{onConflict:'session_id,problem_id,role'});
    }
  }
  await loadAll();renderImportInline();toast('旧データを取り込みました');
}

  const cardNameForPayment=n=>paymentType(n)==='card'?n:null;

  async function ensureMasters(){

  function derive(date,summaryName,paymentName,amount,points){const s=sum(summaryName),p=pay(paymentName),card=p?.linked_card_id?HH7.cards.find(c=>c.id===p.linked_card_id):null;const real=Math.max(0,amount-points);return {s,p,card,real,billing:billingYM(date,card)};}
  function menuBack(){return '<div class="row" style="margin-bottom:12px"><button class="light" onclick="window.hh7Render(\'home\')">← 家計ホーム</button></div>';}
  function home(){const rows=HH7.transactions.filter(t=>String(t.transaction_date||'').slice(0,7)===HH7.month);let income=0,expense=0,repay=0,borrow=0;rows.forEach(t=>{const a=Number(t.amount||0),pt=t.process_type||'normal';if(pt==='income'||pt==='borrowing')income+=a;else if(pt==='repayment')repay+=a;else if(pt!=='transfer'&&pt!=='card_payment')expense+=a;});const budgets=HH7.budgets.filter(b=>String(b.year_month||'').slice(0,7)===HH7.month);return `<div class="myos-section-head"><div><div class="myos-small">${HH7.month}</div><h3 style="margin:4px 0">今月の家計</h3></div><button class="light" onclick="window.hh7Render('input')">＋ 記録</button></div><div class="myos-card-grid"><div class="myos-card"><div class="myos-small">収入・借入</div><h2>${yen(income)}</h2></div><div class="myos-card"><div class="myos-small">実支出</div><h2>${yen(expense)}</h2></div><div class="myos-card"><div class="myos-small">返済</div><h2>${yen(repay)}</h2></div><div class="myos-card"><div class="myos-small">実収支</div><h2>${yen(income-expense-repay)}</h2></div></div><div class="myos-card" style="margin-top:14px"><div class="myos-section-head"><b>最近の記録</b><button class="light" onclick="window.hh7Render('history')">履歴</button></div>${rows.slice(0,5).map(t=>`<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><span>${esc(t.description)}</span><b>${yen(t.amount)}</b></div>`).join('')||'<div class="myos-small">まだ記録がありません。</div>'}</div><div class="myos-card" style="margin-top:14px"><b>予算</b>${budgets.length?budgets.slice(0,8).map(b=>`<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>${esc(b.category_name)}</span><span>${yen(b.amount)}</span></div></div>`).join(''):'<div class="myos-small">予算は設定画面から追加できます。</div>'}</div>`;}
  function input(){const so=HH7.summaries.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join(''),po=HH7.payments.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');return `${menuBack()}<h3>📝 家計を記録</h3><div class="myos-card-grid"><div class="myos-card"><label>日付</label><input id="hh7Date" type="date" value="${today()}"><label>内容</label><input id="hh7Desc" placeholder="例：ロピア"><label>摘要</label><select id="hh7Summary"><option value="">選択してください</option>${so}</select><label>口座・決済</label><select id="hh7Payment"><option value="">選択してください</option>${po}</select></div><div class="myos-card"><label>金額</label><input id="hh7Amount" type="number" min="0" inputmode="numeric"><label>ポイント利用</label><input id="hh7Points" type="number" min="0" value="0" inputmode="numeric"><label>反映先（任意）</label><input id="hh7Target"><label>メモ</label><input id="hh7Memo"></div></div><div id="hh7Preview" class="myos-card" style="margin-top:14px"></div><button class="primary" style="width:100%;margin-top:12px" onclick="window.hh7Save()">この内容で登録</button>`;}
  function preview(){const date=el('hh7Date')?.value,sn=el('hh7Summary')?.value,pn=el('hh7Payment')?.value,a=Number(el('hh7Amount')?.value||0),pt=Number(el('hh7Points')?.value||0),d=derive(date,sn,pn,a,pt);if(el('hh7Preview'))el('hh7Preview').innerHTML=`<h4 style="margin-top:0">自動判定</h4><div>摘要：<b>${esc(d.s?.name||'—')}</b></div><div>カテゴリ：<b>${esc(d.s?.category_name||'—')}</b></div><div>処理区分：<b>${esc(d.s?.process_type||'—')}</b></div><div>決済：<b>${esc(d.p?.name||'—')}</b></div><div>請求カード：<b>${esc(d.card?.name||'—')}</b></div><div>請求年月：<b>${esc(d.billing||'—')}</b></div><div>金額：<b>${yen(a)}</b> ／ ポイント：<b>${yen(pt)}</b> ／ 実決済：<b>${yen(d.real)}</b></div>`;}
  async function save(){const uid=currentUser.id,date=el('hh7Date').value,desc=el('hh7Desc').value.trim(),sn=el('hh7Summary').value,pn=el('hh7Payment').value,a=Number(el('hh7Amount').value||0),pt=Number(el('hh7Points').value||0),target=el('hh7Target').value.trim()||null,memo=el('hh7Memo').value.trim()||null;if(!date||!desc||!sn||!pn||a<=0||pt<0||pt>a){alert('日付・内容・摘要・決済・金額・ポイントを確認してください。');return;}const d=derive(date,sn,pn,a,pt);const row={user_id:uid,transaction_date:date,description:desc,summary_id:d.s?.id||null,summary_name:d.s?.name||sn,payment_method_id:d.p?.id||null,payment_method_name:d.p?.name||pn,amount:a,points_used:pt,target_input:target,memo,cashflow_type:d.s?.cashflow_type||'expense',category_name:d.s?.category_name||'その他',process_type:d.s?.process_type||'normal',target_auto:d.s?.target_name||null,billing_type:d.s?.billing_type||null,billing_card_id:d.card?.id||null,billing_card_name:d.card?.name||null,billing_year_month:d.billing};const {error}=await sb.from('household_transactions').insert(row);if(error){alert('登録に失敗：'+error.message);return;}await load();toast('家計を登録しました');window.hh7Render('home');}
  function history(){const rows=HH7.transactions.slice(0,100);return `${menuBack()}<div class="myos-section-head"><h3>📋 家計履歴</h3><span class="myos-small">${rows.length}件</span></div>${rows.map(t=>`<div class="myos-card" style="margin:8px 0"><div class="row" style="justify-content:space-between"><div><b>${esc(t.description)}</b><div class="myos-small">${esc(t.transaction_date)} ・ ${esc(t.summary_name||'')} ・ ${esc(t.payment_method_name||'')}</div></div><strong>${yen(t.amount)}</strong></div><div class="myos-small">実決済 ${yen(t.actual_payment)} / ${esc(t.category_name||'')}</div></div>`).join('')||'<div class="myos-card">まだ記録がありません。</div>'}`;}
  function monthly(){const cats={};HH7.transactions.filter(t=>String(t.transaction_date).slice(0,7)===HH7.month&&t.process_type==='normal').forEach(t=>cats[t.category_name||'その他']=(cats[t.category_name||'その他']||0)+Number(t.actual_payment||0));return `${menuBack()}<div class="myos-section-head"><div><div class="myos-small">対象年月</div><input id="hh7Month" type="month" value="${HH7.month}" style="width:auto"></div></div><div class="myos-card"><h3>📊 月次支出</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${esc(n)}</span><b>${yen(v)}</b></div>`).join('')||'<div class="myos-small">この月の支出はありません。</div>'}</div>`;}
  function cards(){
  const base=new Date(HH7.month+'-01T00:00:00');

  function addMonth(n){
    const d=new Date(base);
    d.setMonth(d.getMonth()+n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  const months=[
    {ym:addMonth(0),label:'当月'},
    {ym:addMonth(1),label:'来月'},
    {ym:addMonth(2),label:'再来月'}
  ];

  return `${menuBack()}
    <h3>💳 カード請求</h3>
    ${months.map(m=>`
      <div class="myos-card" style="margin-top:14px">
        <div class="myos-section-head">
          <div>
            <div class="myos-small">${m.label}</div>
            <h3 style="margin:4px 0">${m.ym}</h3>
          </div>
        </div>

        ${HH7.cards.map(c=>{
          const b=HH7.transactions
            .filter(t=>
              t.billing_card_id===c.id &&
              String(t.billing_year_month||'').slice(0,7)===m.ym
            )
            .reduce((x,t)=>x+Number(t.actual_payment||0),0);

          return `
            <div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee">
              <div>
                <b>${esc(c.name)}</b>
                <div class="myos-small">締日 ${esc(c.close_day)}日 / 引落 ${esc(c.withdrawal_day)}日</div>
              </div>
              <strong>${yen(b)}</strong>
            </div>
          `;
        }).join('') || '<div class="myos-small">カードを登録してください。</div>'}
      </div>
    `).join('')}`;
}
  function assets(){const acc=HH7.accounts.map(a=>{const tx=HH7.transactions.filter(t=>t.payment_method_name===a.name);let bal=Number(a.initial_balance||0);tx.forEach(t=>{const amt=Number(t.actual_payment||0),pt=t.process_type;if(t.cashflow_type==='income')bal+=amt;else if(pt==='normal')bal-=amt;});return `<div class="row" style="justify-content:space-between;padding:9px 0"><span>${esc(a.name)}</span><b>${yen(bal)}</b></div>`}).join('');const cards=HH7.cards.map(c=>{const b=HH7.transactions.filter(t=>t.billing_card_id===c.id).reduce((x,t)=>x+Number(t.actual_payment||0),0);return `<div class="row" style="justify-content:space-between;padding:9px 0"><span>${esc(c.name)}</span><b>${yen(b)}</b></div>`}).join('');return `${menuBack()}<h3>🏦 資産・負債</h3><div class="myos-card-grid"><div class="myos-card"><h3>現預金</h3>${acc||'<div class="myos-small">口座を登録してください。</div>'}</div><div class="myos-card"><h3>カード負債</h3>${cards||'<div class="myos-small">カードを登録してください。</div>'}</div></div>`;}
  function settings(){return `${menuBack()}<h3>⚙ 家計設定</h3><div class="myos-card-grid"><div class="myos-card"><h3>摘要を追加</h3><input id="hh7NewSummary" placeholder="例：食材費"><select id="hh7NewSummaryType"><option value="normal">通常支出</option><option value="income">収入</option><option value="borrowing">借入</option><option value="repayment">返済</option><option value="transfer">振替</option><option value="card_payment">カード引落</option></select><button class="primary" style="margin-top:10px" onclick="window.hh7AddSummary()">摘要を追加</button><div class="myos-small" style="margin-top:8px">現在 ${HH7.summaries.length}件</div></div><div class="myos-card"><h3>決済方法を追加</h3><input id="hh7NewPayment" placeholder="例：現金、三井住友銀行、JCB W"><select id="hh7NewPaymentType"><option value="cash">現金</option><option value="bank">銀行口座</option><option value="wallet">電子マネー・QR</option><option value="card">クレジットカード</option><option value="transit">交通系IC</option><option value="other">その他</option></select><button class="primary" style="margin-top:10px" onclick="window.hh7AddPayment()">決済方法を追加</button><div class="myos-small" style="margin-top:8px">現在 ${HH7.payments.length}件</div></div><div class="myos-card"><h3>口座を追加</h3><input id="hh7NewAccount" placeholder="例：三井住友銀行"><input id="hh7NewAccountBalance" type="number" placeholder="初期残高" value="0"><select id="hh7NewAccountType"><option value="bank">銀行口座</option><option value="cash">現金</option><option value="wallet">電子マネー・QR</option><option value="transit">交通系IC</option><option value="other">その他</option></select><button class="primary" style="margin-top:10px" onclick="window.hh7AddAccount()">口座を追加</button><div class="myos-small" style="margin-top:8px">現在 ${HH7.accounts.length}件</div></div><div class="myos-card"><h3>カードを追加</h3><input id="hh7NewCard" placeholder="例：JCB W"><div class="myos-card-grid"><input id="hh7CloseDay" type="number" min="1" max="31" placeholder="締日" value="15"><input id="hh7WithdrawalDay" type="number" min="1" max="31" placeholder="引落日" value="10"></div><button class="primary" style="margin-top:10px" onclick="window.hh7AddCard()">カードを追加</button><div class="myos-small" style="margin-top:8px">現在 ${HH7.cards.length}件</div></div></div><div class="myos-small" style="margin-top:14px">※ 対象年月はここで毎回入力する必要はありません。月次画面で確認・変更できます。</div>`;}
  async function saveSettings(){return;}
  async function addSummary(){const uid=currentUser.id,name=el('hh7NewSummary')?.value.trim(),type=el('hh7NewSummaryType')?.value||'normal';if(!name)return;const map={normal:['expense',name,'normal'],income:['income','収入','income'],borrowing:['income','借入・返済','borrowing'],repayment:['expense','借入・返済','repayment'],transfer:['expense','資金移動・引落','transfer'],card_payment:['expense','資金移動・引落','card_payment']};const [cf,cat,pt]=map[type];const {error}=await sb.from('household_summaries').upsert({user_id:uid,name,cashflow_type:cf,category_name:cat,process_type:pt,target_name:null,billing_type:type==='card_payment'?'card':null,archived:false},{onConflict:'user_id,name',ignoreDuplicates:true});if(error){alert('摘要追加に失敗：'+error.message);return;}await load();toast('摘要を追加しました');render('settings');}
  async function addPayment(){const uid=currentUser.id,name=el('hh7NewPayment')?.value.trim(),type=el('hh7NewPaymentType')?.value||'cash';if(!name)return;const {error}=await sb.from('household_payment_methods').upsert({user_id:uid,name,method_type:type,linked_card_id:null,archived:false},{onConflict:'user_id,name',ignoreDuplicates:true});if(error){alert('決済方法追加に失敗：'+error.message);return;}await load();toast('決済方法を追加しました');render('settings');}
  async function addAccount(){const uid=currentUser.id,name=el('hh7NewAccount')?.value.trim(),bal=Number(el('hh7NewAccountBalance')?.value||0),type=el('hh7NewAccountType')?.value||'bank';if(!name)return;const {error}=await sb.from('household_accounts').upsert({user_id:uid,name,account_type:type,initial_balance:bal,archived:false},{onConflict:'user_id,name',ignoreDuplicates:true});if(error){alert('口座追加に失敗：'+error.message);return;}const {error:pe}=await sb.from('household_payment_methods').upsert({user_id:uid,name,method_type:type,linked_card_id:null,archived:false},{onConflict:'user_id,name',ignoreDuplicates:true});if(pe){alert('口座は追加されましたが決済方法の連携に失敗：'+pe.message);return;}await load();toast('口座を追加しました');render('settings');}
  async function addCard(){const uid=currentUser.id,name=el('hh7NewCard')?.value.trim(),close=Number(el('hh7CloseDay')?.value||15),wd=Number(el('hh7WithdrawalDay')?.value||10);if(!name)return;const {data:card,error}=await sb.from('household_cards').insert({user_id:uid,name,close_day:close,billing_month_before_close:1,billing_month_after_close:1,withdrawal_day:wd,archived:false}).select('id').single();if(error){alert('カード追加に失敗：'+error.message);return;}const {data:pm}=await sb.from('household_payment_methods').select('id').eq('user_id',uid).eq('name',name).maybeSingle();if(pm){await sb.from('household_payment_methods').update({linked_card_id:card.id,method_type:'card'}).eq('id',pm.id).eq('user_id',uid);}else{const {error:pe}=await sb.from('household_payment_methods').insert({user_id:uid,name,method_type:'card',linked_card_id:card.id,archived:false});if(pe){alert('カードは追加されましたが決済方法の連携に失敗：'+pe.message);return;}}await load();toast('カードを追加しました');render('settings');}
  function render(screen){const box=el('hhScreen');if(!box)return;const v={home,input,history,monthly,cards,assets,settings};box.innerHTML=(v[screen]||home)();if(screen==='input'){['hh7Date','hh7Amount','hh7Points','hh7Summary','hh7Payment'].forEach(id=>el(id)?.addEventListener('input',preview));['hh7Summary','hh7Payment'].forEach(id=>el(id)?.addEventListener('change',preview));preview();}if(screen==='monthly')el('hh7Month')?.addEventListener('change',e=>{HH7.month=e.target.value;render('monthly');});}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-hh-screen]');if(b){e.preventDefault();render(b.dataset.hhScreen);}});
  window.hh7Render=render;window.hh7Save=save;window.hh7SaveSettings=saveSettings;window.hh7AddSummary=addSummary;window.hh7AddPayment=addPayment;window.hh7AddAccount=addAccount;window.hh7AddCard=addCard;
  window.addEventListener('myos-user-ready',load);
  const timer=setInterval(()=>{if(currentUser?.id){clearInterval(timer);load();}},400);
  render('home');
})();
</script>
